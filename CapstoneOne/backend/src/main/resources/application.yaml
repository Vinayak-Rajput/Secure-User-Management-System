spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: CapstoneOne
  datasource:
    url: jdbc:postgresql://localhost:5432/capstone_one
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    locations: classpath:db/migration

audit:
  datasource:
    url: jdbc:postgresql://localhost:5432/capstone_one
    writer-username: ${AUDIT_DB_WRITER_USERNAME:capstone_audit_writer}
    writer-password: ${AUDIT_DB_WRITER_PASSWORD}
    reader-username: ${AUDIT_DB_READER_USERNAME:capstone_audit_reader}
    reader-password: ${AUDIT_DB_READER_PASSWORD}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:30000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:60000000}

auth:
  refresh-cookie:
    secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

frontend:
  allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000}

resilience4j:
  ratelimiter:
    instances:
      loginAccount:
        limitForPeriod: 5
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
      loginClientIp:
        limitForPeriod: 30
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
      authenticatedUser:
        limitForPeriod: 120
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
      authenticatedClientIp:
        limitForPeriod: 300
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
      authenticatedSensitive:
        limitForPeriod: 30
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
  circuitbreaker:
    instances:
      authenticationDatabase:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.dao.DataAccessResourceFailureException
      auditLogDatabase:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.dao.DataAccessResourceFailureException
