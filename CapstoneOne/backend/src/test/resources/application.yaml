spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
audit:
  datasource:
    url: jdbc:h2:mem:capstone_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    writer-username: sa
    writer-password:
    reader-username: sa
    reader-password:

jwt:
  secret: test-secret-key-that-is-long-enough-for-hmac-sha256
  expiration: 30000
  refresh-expiration: 60000000

frontend:
  allowed-origins: http://localhost:3000

resilience4j:
  ratelimiter:
    instances:
      loginAccount:
        limitForPeriod: 100
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
      loginClientIp:
        limitForPeriod: 100
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
      authenticatedUser:
        limitForPeriod: 120
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
      authenticatedClientIp:
        limitForPeriod: 300
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
      authenticatedSensitive:
        limitForPeriod: 30
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
  circuitbreaker:
    instances:
      authenticationDatabase:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.dao.DataAccessResourceFailureException
      auditLogDatabase:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.dao.DataAccessResourceFailureException
